name: 'oaktree_dbt'
version: '1.0.0'
config-version: 2

profile: 'oaktree_dbt'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  oaktree_dbt:
    bronze:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table

seeds:
  oaktree_dbt:
    +schema: bronze
